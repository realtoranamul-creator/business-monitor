name: Infrastructure Monitor

on:
  schedule:
    # Every 15 minutes — PUBLIC repo = unlimited GitHub Actions minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore monitor state from cache
        uses: actions/cache@v4
        with:
          path: monitor-state.json
          key: monitor-state
          restore-keys: |
            monitor-state

      - name: Run monitoring checks
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OWNER_PRIVATE_ALERT_EMAIL: ${{ secrets.OWNER_PRIVATE_ALERT_EMAIL }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: python monitor.py

      - name: Save monitor state to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: monitor-state.json
          key: monitor-state
