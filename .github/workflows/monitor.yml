name: Infrastructure Monitor

on:
  schedule:
    # Every 10 minutes (independent of Vercel — runs on GitHub infrastructure)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write # Needed to commit state file for dedup
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitoring checks
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OWNER_PRIVATE_ALERT_EMAIL: ${{ secrets.OWNER_PRIVATE_ALERT_EMAIL }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python monitor.py

      - name: Commit state file (for dedup + recovery tracking)
        run: |
          if [ -f monitor-state.json ]; then
            git config --global user.name "Business Monitor Bot"
            git config --global user.email "actions@github.com"
            git add monitor-state.json
            git commit -m "chore: update monitor state [skip ci]" || echo "No state changes"
            git push || echo "Push failed (non-critical)"
          fi
